---
layout: compress
---

<!doctype html>
<html lang="{{ page.lang | default: 'en' | escape }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main"{% if page.posts_page or layout.posts_page or page.reading_notes_page or page.rednote_page %} class="main--wide"{% endif %} role="main">
      {% include sidebar.html %}
    
      <article class="page{% if page.posts_page or layout.posts_page or page.reading_notes_page or page.rednote_page %} page--wide{% endif %}{% if page.reading_notes_page %} page--reading-notes{% endif %}{% if page.posts_page or layout.posts_page %} page--posts{% endif %}"{% if page.lang %} lang="{{ page.lang | escape }}"{% endif %} itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    {% include scripts.html %}

  </body>
</html>
